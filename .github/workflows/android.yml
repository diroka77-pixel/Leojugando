name: Compilar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Preparar Android SDK
        run: |
          SDKMANAGER_PATH=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER_PATH"
          yes | "$SDKMANAGER_PATH" --licenses >/dev/null || true
          "$SDKMANAGER_PATH" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar la web nativa
        run: npm run prepare:www

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Comprobar el proyecto
        run: |
          npm test
          test ! -f android/app/src/main/assets/public/sw.js

      - name: Preparar firma
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/leo-jugando-release.jks"
            echo "SIGNED_BUILD=true" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/leo-jugando-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "SIGNED_BUILD=false" >> "$GITHUB_ENV"
            echo "No están los cuatro secretos de firma. Se compilará un APK debug instalable."
          fi

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$SIGNED_BUILD" = "true" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../LeoJugando.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../LeoJugando.apk
          fi

      - name: Verificar APK
        run: |
          test -s LeoJugando.apk
          jarsigner -verify -certs LeoJugando.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: LeoJugando-APK
          path: LeoJugando.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: android-${{ github.run_number }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" LeoJugando.apk --clobber
          else
            gh release create "$RELEASE_TAG" LeoJugando.apk \
              --title "Leo Jugando 1.0.${{ github.run_number }}" \
              --notes "APK generado automáticamente desde la rama main."
          fi
